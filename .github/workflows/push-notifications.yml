name: Notifications iPad

# Robot gratuit (dépôt public) : surveille Firebase et envoie les notifications
# des nouveautés aux iPads abonnés. Chaque session dure ~5 h 40 ; une nouvelle
# session est programmée toutes les 20 min et attend son tour (une seule à la fois),
# donc le robot tourne en continu.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run (surveillance), test (notification de test), signup (création du compte robot)'
        default: run
        type: choice
        options: [run, test, signup]

concurrency:
  group: push-notifier-${{ github.event.inputs.mode || 'run' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/push-notifier
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer
        working-directory: scripts/push-notifier
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Surveiller et notifier
        working-directory: scripts/push-notifier
        env:
          MODE: ${{ github.event.inputs.mode || 'run' }}
          RUN_MINUTES: '340'
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node notifier.mjs
