services:
  - type: web
    name: seconde-platform
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Service-Worker-Allowed
        value: /
      - path: /manifest.json
        name: Content-Type
        value: application/manifest+json
    envVars:
      - key: NODE_ENV
        value: production